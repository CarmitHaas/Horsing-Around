version: "3"
services:
  web:
    image: ${IMAGE_NAME}:${BUILD_NUMBER}
    environment:
      - MONGO_URI=mongodb://mongo:27017/
    depends_on:
      - mongo
    networks:
      - app-network

  mongo:
    image: mongo:latest
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  nginx:
    image: ${IMAGE_NAME}-nginx:${BUILD_NUMBER}
    ports:
      - "80:80"
    depends_on:
      - web
    networks:
      - app-network

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge