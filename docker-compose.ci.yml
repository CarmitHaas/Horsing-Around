version: "3"
services:
  web:
    image: ${IMAGE_NAME}:${BUILD_NUMBER}
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/
    depends_on:
      - mongo
    networks:
      - db-network
      - frontend-network

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - db-network

  nginx:
    image: ${IMAGE_NAME}-nginx:${BUILD_NUMBER}
    ports:
      - "80:80"
    depends_on:
      - web
    networks:
      - frontend-network

volumes:
  mongodb_data:

networks:
  db-network:
    driver: bridge
  frontend-network:
    driver: bridge