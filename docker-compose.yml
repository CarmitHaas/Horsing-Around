services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/
    depends_on:
      - mongo
    networks:
      - db-network
      - frontend-network
  mongo:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    networks:
      - db-network
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/static
    networks:
      - frontend-network
volumes:
  mongodb_data:
networks:
  db-network:
    driver: bridge
  frontend-network:
    driver: bridge
